<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WYHK JASER Tree</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="hero">
    <img src="front.png" alt="WYHK JASER Tree" class="hero-img">
    <div class="scroll-cue">Scroll</div>
  </section>

  <div id="legend">
    <div class="legend-instruction">Click any JASER to explore the chain. Click again to unselect.</div>
    <span class="legend-item"><span class="legend-swatch swatch-selected"></span> Selected</span>
    <span class="legend-item"><span class="legend-swatch swatch-ancestor"></span> JASERs Chain</span>
    <span class="legend-item"><span class="legend-swatch swatch-mentee"></span> Son(s)</span>
  </div>

  <div id="tree-wrapper">
    <div id="tree-container">
      <div class="tree-panel"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
