<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JASER Tree</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>WYHK JASER Tree</h1>
    <p class="subtitle">Click a name to see their lineage</p>
  </header>

  <nav id="tabs"></nav>

  <div id="legend">
    <span class="legend-item"><span class="legend-swatch swatch-selected"></span> Selected</span>
    <span class="legend-item"><span class="legend-swatch swatch-ancestor"></span> Mentor chain</span>
    <span class="legend-item"><span class="legend-swatch swatch-mentee"></span> Direct mentees</span>
    <span class="legend-item"><span class="legend-swatch swatch-dimmed"></span> Others</span>
  </div>

  <div id="tree-wrapper">
    <div id="tree-container">
      <div class="tree-panel" data-tree="A"></div>
      <div class="tree-panel" data-tree="B"></div>
      <div class="tree-panel" data-tree="C"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
